[package]
name = "hermes"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A deterministic, auditable forward-chaining rule engine with pluggable scoring"
repository = "https://github.com/Sing-Security/hermes"

[lib]
doctest = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# -- Expression Evaluation
hel = "0.2.0"
# -- Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# -- ML/ONNX
tract-onnx = { version = "0.21", optional = true }
# -- Others
derive_more = { version = "2", features = ["from", "display"] }

[features]
default = []
onnx = ["tract-onnx"]

[dev-dependencies]
tempfile = "3"
